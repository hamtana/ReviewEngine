name: Deploy to VPS
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over Tailscale SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new dockeruser@${{ secrets.VPS_TAILSCALE_IP }} '
            cd /opt/projects/ReviewEngine
            git pull origin main
            docker stop review-engine || true
            docker rm review-engine || true
            docker build -t review-engine-app-prod .
            docker image prune -f
            docker run -d \
              --name review-engine \
              -p 3001:3001 \
              --restart always \
              review-engine-app-prod
          '
